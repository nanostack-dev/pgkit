name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

# Lint and tests are Dagger checks (dagger.toml): the official go and
# golangci-lint modules, with tests in pgkit's base that brings a Docker daemon
# for testcontainers. `dagger check` runs them the same way on a laptop. This
# public repository stays on GitHub-hosted runners, so each run starts cold.
env:
  DAGGER_VERSION: v1.0.0-beta.24
  DAGGER_ENGINE: image://registry.dagger.io/engine:v1.0.0-beta.24
  DAGGER_NO_NAG: '1'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install the Dagger CLI
        run: ./scripts/ci/install-dagger.sh "$RUNNER_TEMP/dagger-bin"
      - name: Run every check
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/dagger-bin:$PATH"
          dagger check --progress=report
