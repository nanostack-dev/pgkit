name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8

      - name: Run tests
        run: go test -race -count=1 -timeout 10m ./...
