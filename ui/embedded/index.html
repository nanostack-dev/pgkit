<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171717'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='8' y='14.5' width='11' height='3' rx='1.5' fill='%23fff' opacity='.7'/%3E%3Crect x='8' y='20' width='6' height='3' rx='1.5' fill='%23fff' opacity='.45'/%3E%3C/svg%3E"
		/>
		<title>pgkit admin</title>
		<script>
			(function () {
				var preference = 'system';
				try {
					preference = localStorage.getItem('pgkit-theme') || 'system';
				} catch (error) {}
				var dark =
					preference === 'dark' ||
					(preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
